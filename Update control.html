<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Display Sekolah</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#061512;color:#fff;font-family:sans-serif;padding:20px;max-width:600px;margin:0 auto}
h1{color:#f4c430;margin-bottom:5px}
h3{color:#f4c430;margin:15px 0 5px;border-bottom:1px solid rgba(244,196,48,0.2);padding-bottom:3px}
label{display:block;margin-top:8px;color:rgba(255,255,255,0.5);font-size:0.75rem}
input,textarea,select{width:100%;padding:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:#fff;font-size:16px;font-family:inherit;margin-top:3px}
input:focus,textarea:focus,select:focus{outline:none;border-color:#f4c430}
button{padding:12px;background:#f4c430;color:#1a1a1a;border:none;border-radius:8px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;font-family:inherit}
.b2{background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.12)}
hr{border:none;border-top:1px solid rgba(255,255,255,0.1);margin:15px 0}
.row{display:flex;gap:6px}
.row>div{flex:1}
.br{background:rgba(255,255,255,0.04);padding:10px;border-radius:8px;margin-bottom:6px;border:1px solid rgba(255,255,255,0.08)}
.bl{color:#f4c430;font-weight:700;font-size:0.85rem;margin-bottom:4px}
.bt{display:flex;gap:6px;align-items:center}
.bt input[type=time]{flex:1}
.bt input[type=checkbox]{width:auto}
.ab{background:rgba(255,255,255,0.04);border:1px dashed rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);padding:8px;border-radius:6px;cursor:pointer;width:100%;margin-top:6px;font-family:inherit}
.ab:hover{border-color:#f4c430;color:#f4c430}
#st{text-align:center;font-weight:700;margin-top:10px;padding:8px;border-radius:6px}
.ok{background:rgba(76,175,80,0.15);color:#4caf50}
.er{background:rgba(255,82,82,0.15);color:#ff5252}
.ld{background:rgba(244,196,48,0.15);color:#f4c430}
.db{background:rgba(255,82,82,0.1);color:#ff5252;border:1px solid rgba(255,82,82,0.2);padding:6px;border-radius:6px;cursor:pointer;font-size:0.75rem;font-family:inherit;margin-top:4px;width:100%}
.db:hover{background:#ff5252;color:#fff}
</style>
</head>
<body>
<h1><i class="fas fa-cog"></i> Control Display Sekolah</h1>
<p style="color:rgba(255,255,255,0.4);font-size:0.8rem;margin-bottom:15px">Atur di sini - TV update 5 detik</p>
<h3>Info Sekolah</h3>
<label>Nama</label><input id="schoolName" value="PPTQ JASMA DIGITAL">
<label>Alamat</label><input id="schoolAddress" value="Jl. Pendidikan No. 123">
<label>Website</label><input id="schoolWebsite" value="www.pptq-jasma.sch.id">
<label>Logo (2 huruf)</label><input id="schoolLogo" value="PJ" maxlength="2">
<label>Teks Arab</label><input id="arabicText" value="بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ">
<label>Motto</label><input id="motto" value="Belajar - Beriman - Beramal">
<hr>
<h3>Pengumuman</h3>
<label>Volume Bell (%)</label><input type="range" id="volume" min="0" max="100" value="80">
<label>Pengumuman 1</label><textarea id="announcement1">Seluruh siswa wajib berpakaian seragam lengkap.</textarea>
<label>Pengumuman 2</label><textarea id="announcement2">Pendaftaran siswa baru dibuka.</textarea>
<hr>
<h3>Tema</h3>
<select id="theme">
<option value="islamic-green">Hijau Islamic</option>
<option value="royal-blue">Biru Royal</option>
<option value="royal-purple">Ungu Royal</option>
<option value="sunset-orange">Sunset Orange</option>
<option value="crimson-red">Merah Crimson</option>
<option value="teal-ocean">Teal Ocean</option>
<option value="dark-gold">Emas Gelap</option>
<option value="midnight-indigo">Indigo Malam</option>
</select>
<hr>
<h3>Wallpaper</h3>
<label>URL Gambar</label><input id="wallpaperUrl" placeholder="https://...">
<label>YouTube Background</label><input id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=...">
<label>Transparansi YouTube (%)</label><input type="range" id="ytOverlay" min="0" max="80" value="30">
<label>Judul Foto</label><input id="buildingTitle" value="Gedung Utama Sekolah">
<label>Subtitle</label><input id="buildingSubtitle" value="Pusat kegiatan belajar mengajar">
<hr>
<h3>Bell Sekolah</h3>
<div id="bellSlots"></div>
<hr>
<h3>Nama Kolom & Jadwal</h3>
<label>Nama Kolom Kiri</label><input id="colLeft" value="JADWAL PELAJARAN" style="font-weight:700">
<label>Nama Kolom Kanan</label><input id="colRight" value="JADWAL PELAJARAN" style="font-weight:700">
<div id="scheduleSlots"></div>
<button class="ab" onclick="addSchedule()"><i class="fas fa-plus"></i> Tambah Jadwal</button>
<hr>
<button onclick="saveToFirebase()"><i class="fas fa-save"></i> SIMPAN KE FIREBASE</button>
<button class="b2" onclick="loadFromFirebase()"><i class="fas fa-download"></i> LOAD DARI FIREBASE</button>
<div id="st"></div>
<script>
var DB="https://dispay-sekolah-default-rtdb.asia-southeast1.firebasedatabase.app";
var bells={masuk:{time:"07:00",label:"Jam Masuk",enabled:true,musicUrl:""},istirahat1:{time:"09:30",label:"Istirahat 1",enabled:true,musicUrl:""},ganti1:{time:"09:45",label:"Ganti 1",enabled:true,musicUrl:""},ganti2:{time:"10:45",label:"Ganti 2",enabled:true,musicUrl:""},istirahat2:{time:"11:30",label:"Istirahat 2",enabled:true,musicUrl:""},ganti3:{time:"12:30",label:"Ganti 3",enabled:true,musicUrl:""},ganti4:{time:"13:30",label:"Ganti 4",enabled:true,musicUrl:""},ganti5:{time:"14:30",label:"Ganti 5",enabled:true,musicUrl:""},pulang:{time:"15:30",label:"Pulang",enabled:true,musicUrl:""}};
var schedules=[];
function renderBells(){var h="";Object.keys(bells).forEach(function(k){var b=bells[k];h+='<div class="br"><div class="bl">'+b.label+'</div><div class="bt"><input type="time" value="'+b.time+'" data-k="'+k+'" onchange="bells[this.dataset.k].time=this.value"><input type="checkbox" '+(b.enabled?"checked":"")+' data-k="'+k+'" onchange="bells[this.dataset.k].enabled=this.checked"><span style="font-size:0.8rem">Aktif</span></div><input type="text" value="'+(b.musicUrl||"")+'" data-k="'+k+'" placeholder="URL MP3" onchange="bells[this.dataset.k].musicUrl=this.value" style="margin-top:3px;font-size:0.8rem"></div>';});document.getElementById("bellSlots").innerHTML=h;}
function addSchedule(){schedules.push({class:"KELAS ",subject:"Mapel",start:"07:00",end:"08:00",column:"left"});renderSchedules();}
function deleteSchedule(i){schedules.splice(i,1);renderSchedules();}
function renderSchedules(){var h="";schedules.forEach(function(s,i){h+='<div class="br"><div class="row"><div><label>Kelas</label><input value="'+s.class+'" data-i="'+i+'" data-f="class" onchange="schedules[parseInt(this.dataset.i)].class=this.value"></div><div><label>Mapel</label><input value="'+s.subject+'" data-i="'+i+'" data-f="subject" onchange="schedules[parseInt(this.dataset.i)].subject=this.value"></div></div><div class="row"><div><label>Mulai</label><input type="time" value="'+s.start+'" data-i="'+i+'" data-f="start" onchange="schedules[parseInt(this.dataset.i)].start=this.value"></div><div><label>Selesai</label><input type="time" value="'+s.end+'" data-i="'+i+'" data-f="end" onchange="schedules[parseInt(this.dataset.i)].end=this.value"></div></div><div class="row"><div><label>Kolom</label><select data-i="'+i+'" data-f="column" onchange="schedules[parseInt(this.dataset.i)].column=this.value"><option value="left" '+(s.column==="left"?"selected":"")+'>Kiri</option><option value="right" '+(s.column==="right"?"selected":"")+'>Kanan</option></select></div><div style="display:flex;align-items:flex-end"><button class="db" onclick="deleteSchedule('+i+')">Hapus</button></div></div></div>';});document.getElementById("scheduleSlots").innerHTML=h;}
function saveToFirebase(){var data={school:{name:val("schoolName"),address:val("schoolAddress"),website:val("schoolWebsite"),logo:val("schoolLogo").toUpperCase(),arabic:val("arabicText"),motto:val("motto")},volume:parseInt(val("volume")),announcements:{left:val("announcement1"),right:val("announcement2")},theme:val("theme"),wallpaperUrl:val("wallpaperUrl"),youtubeUrl:val("youtubeUrl"),ytOverlay:parseInt(val("ytOverlay")),building:{title:val("buildingTitle"),subtitle:val("buildingSubtitle")},colTitles:{left:val("colLeft"),right:val("colRight")},bells:{},schedules:schedules};Object.keys(bells).forEach(function(k){data.bells[k]={time:bells[k].time,label:bells[k].label,enabled:bells[k].enabled,musicUrl:bells[k].musicUrl||""};});setSt("Menyimpan...","ld");fetch(DB+"/settings.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}).then(function(r){return r.json();}).then(function(){setSt("Tersimpan!","ok");}).catch(function(e){setSt("Error: "+e.message,"er");});}
function loadFromFirebase(){setSt("Loading...","ld");fetch(DB+"/settings.json").then(function(r){return r.json();}).then(function(d){if(!d){setSt("Belum ada data","ld");return;}if(d.school){setV("schoolName",d.school.name);setV("schoolAddress",d.school.address);setV("schoolWebsite",d.school.website);setV("schoolLogo",d.school.logo);setV("arabicText",d.school.arabic);setV("motto",d.school.motto);}if(d.volume!==undefined)setV("volume",d.volume);if(d.announcements){setV("announcement1",d.announcements.left);setV("announcement2",d.announcements.right);}if(d.theme)setV("theme",d.theme);if(d.wallpaperUrl!==undefined)setV("wallpaperUrl",d.wallpaperUrl);if(d.youtubeUrl!==undefined)setV("youtubeUrl",d.youtubeUrl);if(d.ytOverlay!==undefined)setV("ytOverlay",d.ytOverlay);if(d.building){setV("buildingTitle",d.building.title);setV("buildingSubtitle",d.building.subtitle);}if(d.colTitles){setV("colLeft",d.colTitles.left);setV("colRight",d.colTitles.right);}if(d.bells){Object.keys(d.bells).forEach(function(k){if(bells[k]){bells[k].time=d.bells[k].time;bells[k].enabled=d.bells[k].enabled;bells[k].musicUrl=d.bells[k].musicUrl||"";}});renderBells();}if(d.schedules){schedules=d.schedules;renderSchedules();}setSt("Data dimuat!","ok");}).catch(function(e){setSt("Error: "+e.message,"er");});}
function val(id){return document.getElementById(id).value;}
function setV(id,v){var el=document.getElementById(id);if(el&&v!==undefined&&v!==null)el.value=v;}
function setSt(m,c){var s=document.getElementById("st");s.textContent=m;s.className=c||"";}
renderBells();renderSchedules();loadFromFirebase();
</script>
</body>
</html>
